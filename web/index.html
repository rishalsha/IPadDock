<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Home Dock</title>
  
  <!-- Apple Fullscreen Kiosk Mode Meta Tags for iOS 10 Safari -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home Dock">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0a0e17">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="dock-container">
    
    <!-- LEFT SIDEBAR: Clock, Status, and Quick Modes -->
    <aside class="dock-sidebar">
      <div class="sidebar-top">
        <div class="greeting-tag" id="live-greeting">WELCOME HOME</div>
        <div class="clock-display">
          <div class="time-row">
            <span id="live-time" class="time-text">12:00</span>
            <span id="live-ampm" class="ampm-text">PM</span>
          </div>
          <div id="live-date" class="date-text">Friday, October 2</div>
        </div>

        <div class="status-summary-card">
          <div class="status-summary-header">
            <span class="status-dot" id="mqtt-dot"></span>
            <span class="status-title" id="mqtt-label">Connecting...</span>
          </div>
          <div class="status-summary-sub" id="device-summary-text">3 Relays Connected</div>
        </div>
      </div>

      <div class="sidebar-scenes">
        <div class="sidebar-section-label">QUICK SCENES</div>
        <div class="scenes-list">
          <button class="scene-tile" onclick="triggerScene('all_off')">
            <div class="scene-icon-box">🌙</div>
            <div class="scene-info">
              <span class="scene-name">All Off</span>
              <span class="scene-desc">Sleep & turn off</span>
            </div>
          </button>
          <button class="scene-tile" onclick="triggerScene('work_mode')">
            <div class="scene-icon-box">💼</div>
            <div class="scene-info">
              <span class="scene-name">Work Mode</span>
              <span class="scene-desc">Lights on, wake PC</span>
            </div>
          </button>
          <button class="scene-tile" onclick="triggerScene('relax_mode')">
            <div class="scene-icon-box">🛋️</div>
            <div class="scene-info">
              <span class="scene-name">Relax Mode</span>
              <span class="scene-desc">Fan & soft lights</span>
            </div>
          </button>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="settings-trigger-btn" onclick="openSettings()">
          <span class="settings-icon">⚙️</span>
          <span>Broker Settings</span>
        </button>
      </div>
    </aside>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="dock-main">
      <!-- Section 1: Room Relays -->
      <section class="dashboard-section">
        <div class="section-header">
          <div>
            <h2 class="section-title">Room Relays</h2>
            <div class="section-subtitle">Tasmota Multi-Channel Control</div>
          </div>
          <div class="section-badge" id="relays-active-count">0 ACTIVE</div>
        </div>

        <div id="devices-grid" class="cards-grid">
          <!-- Rendered dynamically via app.js -->
        </div>
      </section>

      <!-- Section 2: Workstations & PCs -->
      <section class="dashboard-section">
        <div class="section-header">
          <div>
            <h2 class="section-title">Workstations</h2>
            <div class="section-subtitle">Power & Wake-on-LAN</div>
          </div>
        </div>

        <div id="computers-grid" class="computers-grid">
          <!-- Rendered dynamically via app.js -->
        </div>
      </section>
    </main>

  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Broker Configuration</h3>
        <button class="icon-btn-close" onclick="closeSettings()">✕</button>
      </div>
      
      <div class="form-group">
        <label for="cfg-host">Azure MQTT Broker Host / IP</label>
        <input type="text" id="cfg-host" placeholder="e.g. 20.244.45.142">
      </div>
      
      <div class="form-group">
        <label for="cfg-port">WebSocket Port</label>
        <input type="number" id="cfg-port" placeholder="80 (or 9001)">
      </div>

      <div class="form-group">
        <label for="cfg-path">WebSocket Path</label>
        <input type="text" id="cfg-path" placeholder="/mqtt">
      </div>

      <div class="form-group">
        <label for="cfg-user">Username (Optional)</label>
        <input type="text" id="cfg-user" placeholder="Leave blank if none">
      </div>

      <div class="form-group">
        <label for="cfg-pass">Password (Optional)</label>
        <input type="password" id="cfg-pass" placeholder="Leave blank if none">
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeSettings()">Cancel</button>
        <button class="btn-primary" onclick="saveSettings()">Save & Reconnect</button>
      </div>
    </div>
  </div>

  <!-- Scripts: Paho MQTT, Configuration, and Application Logic -->
  <script src="paho-mqtt.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
