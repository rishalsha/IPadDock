<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  
  <!-- Apple Fullscreen Kiosk Mode Meta Tags for iOS 10 Safari -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#000000">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="home-app">
    
    <!-- TOP NAVIGATION & STATUS BAR -->
    <header class="home-header">
      <div class="header-left">
        <div class="header-time-group">
          <span id="live-time" class="home-clock">12:00</span>
          <span id="live-ampm" class="home-ampm">PM</span>
        </div>
        <div class="header-title-group">
          <div id="live-date" class="home-date">Friday, October 2</div>
          <h1 class="room-title">Living Room</h1>
        </div>
      </div>

      <div class="header-right">
        <div class="home-status-chip">
          <span class="status-indicator-dot" id="mqtt-dot"></span>
          <span id="mqtt-label" class="status-chip-text">Connecting...</span>
        </div>
        <button class="settings-circle-btn" onclick="openSettings()" title="Settings">
          <span class="gear-icon">⚙️</span>
        </button>
      </div>
    </header>

    <!-- SCENES CHIPS ROW (Apple Home Style) -->
    <div class="scenes-scroller">
      <button class="scene-chip" onclick="triggerScene('all_off')">
        <span class="scene-chip-icon">🌙</span>
        <span class="scene-chip-title">All Off</span>
      </button>
      <button class="scene-chip" onclick="triggerScene('work_mode')">
        <span class="scene-chip-icon">💼</span>
        <span class="scene-chip-title">Work Mode</span>
      </button>
      <button class="scene-chip" onclick="triggerScene('relax_mode')">
        <span class="scene-chip-icon">🛋️</span>
        <span class="scene-chip-title">Relax</span>
      </button>
    </div>

    <!-- MAIN HOMEKIT GRID -->
    <div class="home-content">
      
      <!-- Section: Room Accessories -->
      <section class="home-section">
        <div class="section-title-row">
          <h2 class="section-heading">Accessories</h2>
          <span class="section-status-sub" id="relays-active-count">0 of 3 On</span>
        </div>
        <div id="devices-grid" class="homekit-grid">
          <!-- Rendered dynamically via app.js -->
        </div>
      </section>

      <!-- Section: Workstations & PCs -->
      <section class="home-section">
        <div class="section-title-row">
          <h2 class="section-heading">Workstations</h2>
        </div>
        <div id="computers-grid" class="workstations-grid">
          <!-- Rendered dynamically via app.js -->
        </div>
      </section>

    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-top">
        <h3 class="modal-heading">Broker Settings</h3>
        <button class="modal-close-btn" onclick="closeSettings()">✕</button>
      </div>
      
      <div class="modal-fields">
        <div class="field-item">
          <label for="cfg-host">Azure Host / IP</label>
          <input type="text" id="cfg-host" placeholder="20.244.45.142">
        </div>
        
        <div class="field-item">
          <label for="cfg-port">WebSocket Port</label>
          <input type="number" id="cfg-port" placeholder="80">
        </div>

        <div class="field-item">
          <label for="cfg-path">WebSocket Path</label>
          <input type="text" id="cfg-path" placeholder="/mqtt">
        </div>

        <div class="field-item">
          <label for="cfg-user">Username</label>
          <input type="text" id="cfg-user" placeholder="Optional">
        </div>

        <div class="field-item">
          <label for="cfg-pass">Password</label>
          <input type="password" id="cfg-pass" placeholder="Optional">
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
        <button class="btn-save" onclick="saveSettings()">Save & Reconnect</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="paho-mqtt.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
