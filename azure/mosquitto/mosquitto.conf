# Mosquitto MQTT Broker Configuration for iPad Dock Hub
# Place in: /etc/mosquitto/mosquitto.conf or mount in Docker

# General settings
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# -------------------------------------------------------------
# Standard MQTT Listener for Tasmota Devices and PC/Laptop Agents
# -------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# -------------------------------------------------------------
# WebSocket Listener for iPad Web Browser Dock (Safari iOS 10)
# -------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# -------------------------------------------------------------
# Security & Authentication
# -------------------------------------------------------------
# For initial test setup, set allow_anonymous true.
# In production, change to false and configure password_file.
allow_anonymous true
# password_file /mosquitto/config/passwords.txt
